# Installed ALONE (before any certificate exists) by infra/scripts/issue-certs.sh: port 80 only, answers the Let's Encrypt
# HTTP-01 challenge for the four host names and nothing else. The real vhosts (which reference the certificates)
# replace it once the certificates are issued.
server {
    listen 80;
    listen [::]:80;
    server_name 670send.tl www.670send.tl app.670send.tl admin.670send.tl api.670send.tl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 404;
    }
}
