# /etc/nginx/nginx.conf for the 670Send edge (installed by infra/scripts/install-nginx.sh).
# Nginx and Certbot run on the HOST; the containers only listen on 127.0.0.1.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept off;
}

http {
    ##
    # Basics
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    types_hash_max_size 2048;
    server_tokens off;                # no version in headers or error pages
    server_names_hash_bucket_size 64;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    ##
    # Small buffers and short timeouts: slow-loris and oversized-header abuse costs little
    ##
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_body_buffer_size 128k;
    client_max_body_size 1m;          # per-vhost override on the API (photo uploads)
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 20s;
    reset_timedout_connection on;

    ##
    # Logging — no query strings (they can carry tokens), real client IP, Díli-neutral ISO 8601 timestamps
    ##
    log_format main '$remote_addr - [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time host=$host';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    ##
    # Compression (text only; the Next.js server compresses its own responses)
    ##
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript
               application/manifest+json application/xml image/svg+xml;

    ##
    # Rate limiting (the API also throttles per IP; this stops floods before they reach Node)
    ##
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=web_general:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    ##
    # TLS defaults shared by every vhost
    ##
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ##
    # Unknown host names (including bare IP scans) get nothing
    ##
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
