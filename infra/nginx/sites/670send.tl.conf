# Public website — https://670send.tl (www redirects to the apex). Next.js standalone on 127.0.0.1:3100.
# Next.js sends its own CSP / HSTS / Permissions-Policy, so the edge adds nothing to avoid duplicate headers.

server {
    listen 80;
    listen [::]:80;
    server_name 670send.tl www.670send.tl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://670send.tl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.670send.tl;
    ssl_certificate     /etc/letsencrypt/live/670send.tl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/670send.tl/privkey.pem;
    include /etc/nginx/snippets/670send/ssl.conf;
    return 301 https://670send.tl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 670send.tl;
    ssl_certificate     /etc/letsencrypt/live/670send.tl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/670send.tl/privkey.pem;
    include /etc/nginx/snippets/670send/ssl.conf;

    limit_req zone=web_general burst=60 nodelay;
    limit_conn perip 30;

    # Anything that is not a plain GET/HEAD never reaches the site (it has no write endpoints).
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    location / {
        include /etc/nginx/snippets/670send/proxy.conf;
        proxy_pass http://127.0.0.1:3100;
    }
}
