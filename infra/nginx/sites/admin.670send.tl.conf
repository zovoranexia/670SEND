# Admin console — https://admin.670send.tl. Static single-page app from the current release.
# Optional hardening: restrict the console to the office / VPN addresses by listing them in
# /etc/nginx/snippets/670send/admin-allowlist.conf (allow 203.0.113.0/24; deny all;). The file ships empty.

server {
    listen 80;
    listen [::]:80;
    server_name admin.670send.tl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://admin.670send.tl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.670send.tl;
    ssl_certificate     /etc/letsencrypt/live/admin.670send.tl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.670send.tl/privkey.pem;
    include /etc/nginx/snippets/670send/ssl.conf;
    include /etc/nginx/snippets/670send/admin-allowlist.conf;

    root /srv/670send/current/admin;
    index index.html;
    limit_req zone=web_general burst=40 nodelay;
    limit_conn perip 20;
    include /etc/nginx/snippets/670send/headers-admin.conf;
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/670send/headers-admin.conf;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/670send/headers-admin.conf;
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(?:js|css|png|svg|ico|map|woff2?)$ {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/670send/headers-admin.conf;
        try_files $uri =404;
    }
}
