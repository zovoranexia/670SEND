# API — https://api.670send.tl → 127.0.0.1:4010 (NestJS, TRUST_PROXY=1).

server {
    listen 80;
    listen [::]:80;
    server_name api.670send.tl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://api.670send.tl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.670send.tl;
    ssl_certificate     /etc/letsencrypt/live/api.670send.tl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.670send.tl/privkey.pem;
    include /etc/nginx/snippets/670send/ssl.conf;

    include /etc/nginx/snippets/670send/headers-api.conf;
    limit_req zone=api_general burst=60 nodelay;
    limit_conn perip 40;
    # Photo uploads are capped at 2 MiB by the API (UPLOAD_MAX_BYTES); a little headroom for multipart overhead.
    client_max_body_size 3m;

    # Only the versioned API is public. Everything else is a 404 from the edge, not from Node.
    location = / { return 404; }

    # Sign-in, refresh and password endpoints: a much tighter budget per IP (the API also locks accounts).
    location ~ ^/v1/auth/(login|login/pin|refresh|password/change|pin/change)$ {
        limit_req zone=api_auth burst=5 nodelay;
        include /etc/nginx/snippets/670send/headers-api.conf;
        include /etc/nginx/snippets/670send/proxy.conf;
        proxy_pass http://127.0.0.1:4010;
    }

    # CSV exports can take a while on a large range.
    location ~ ^/v1/reports/ {
        include /etc/nginx/snippets/670send/headers-api.conf;
        include /etc/nginx/snippets/670send/proxy.conf;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:4010;
    }

    location /v1/ {
        include /etc/nginx/snippets/670send/headers-api.conf;
        include /etc/nginx/snippets/670send/proxy.conf;
        proxy_pass http://127.0.0.1:4010;
    }

    location / { return 404; }
}
