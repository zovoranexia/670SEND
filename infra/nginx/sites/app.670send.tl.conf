# Field app (PWA) — https://app.670send.tl. Static files from the current release; the service worker handles offline.

server {
    listen 80;
    listen [::]:80;
    server_name app.670send.tl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://app.670send.tl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.670send.tl;
    ssl_certificate     /etc/letsencrypt/live/app.670send.tl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.670send.tl/privkey.pem;
    include /etc/nginx/snippets/670send/ssl.conf;

    root /srv/670send/current/pwa;
    index index.html;
    limit_req zone=web_general burst=60 nodelay;
    limit_conn perip 30;
    include /etc/nginx/snippets/670send/headers-pwa.conf;
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    # Fingerprinted bundles never change: cache for a year.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/670send/headers-pwa.conf;
        try_files $uri =404;
    }

    # The shell and the service worker must always be revalidated, or an update would never reach the agents
    # (the app itself waits for the agent to tap "Update").
    location = /index.html            { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/670send/headers-pwa.conf; }
    location = /sw.js                 { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/670send/headers-pwa.conf; }
    location = /manifest.webmanifest  { add_header Cache-Control "no-cache" always; add_header Content-Type "application/manifest+json" always; include /etc/nginx/snippets/670send/headers-pwa.conf; }
    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/670send/headers-pwa.conf;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to the shell (a missing FILE with an extension is a real 404).
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/670send/headers-pwa.conf;
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(?:js|css|png|svg|ico|webmanifest|map|woff2?)$ {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/670send/headers-pwa.conf;
        try_files $uri =404;
    }
}
