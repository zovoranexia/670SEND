# Admin console (admin.670send.tl): no camera, no location, never indexed, never leaks a URL to another site.
# img-src allows the object-storage host of the signed photo / slip URLs (R2 virtual-hosted style). If you serve the
# bucket from a custom domain, replace the wildcard with that host.
include /etc/nginx/snippets/670send/headers-base.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.r2.cloudflarestorage.com; font-src 'self'; connect-src 'self' https://api.670send.tl; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), bluetooth=(), payment=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
