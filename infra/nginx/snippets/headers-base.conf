# Headers every static/API vhost sends. `add_header` is NOT inherited into a block that has its own add_header,
# so every location that sets Cache-Control includes this file again (and the vhost-specific headers file).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
