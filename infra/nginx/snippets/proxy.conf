# Reverse-proxy settings for the two Node containers.
# X-Forwarded-For is OVERWRITTEN with the address Nginx saw (never appended): a client cannot forge the IP the API
# uses for rate limits and the audit log. The API is configured with TRUST_PROXY=1 (exactly this one proxy).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
# proxy_read_timeout is left at Nginx's default (60 s) so a location can raise it (CSV reports) without a duplicate directive.
proxy_buffering on;
proxy_hide_header X-Powered-By;
